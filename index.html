<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcancía Group - Coming Soon</title>
    <link rel="icon" type="image/png" href="media/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #6ab5e0;
            --dark-bg: #ffffff;
            --light-text: #333333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--dark-bg);
            color: var(--light-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .logo {
            max-width: 280px;
            margin-bottom: 40px;
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--primary-blue);
        }
        
        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .contact {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .contact p {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .contact a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        
        .contact a:hover {
            opacity: 0.8;
        }
        
        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .language-switch:hover {
            background: var(--primary-blue);
            color: var(--dark-bg);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }
            
            p {
                font-size: 16px;
            }
            
            .logo {
                max-width: 200px;
            }
            
            .language-switch {
                top: 15px;
                right: 15px;
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <button class="language-switch" onclick="window.location.href='es.html'">ESPAÑOL</button>
    
    <div class="container">
        <img src="media/ALCANCIA LOGO.png" alt="Alcancía Group" class="logo">
        
        <h1>Coming Soon</h1>
        
        <p>We're working on something amazing. Our new website will be ready soon with all the information about our brands and services.</p>
        
        <p>Thank you for your patience!</p>
        
        <div class="contact">
            <p>In the meantime, you can reach us at:</p>
            <a href="mailto:info@alcancia.biz">info@alcancia.biz</a>
        </div>
    </div>
</body>
</html>
